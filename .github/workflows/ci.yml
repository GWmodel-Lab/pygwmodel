name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq libarmadillo-dev libopenblas-dev libgsl-dev

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install armadillo gsl openblas

      - name: Install native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe"
          & $vcpkg install armadillo gsl openblas[threads] --triplet x64-windows

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install nanobind "scikit-build-core[pyproject]" pytest

      - name: Build package
        if: runner.os != 'Windows'
        run: pip install --no-build-isolation -ve .

      - name: Build package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CMAKE_ARGS = "-DBLA_VENDOR=OpenBLAS -DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          pip install --no-build-isolation -ve .

      - name: Run tests
        run: python -m pytest test/ -v
