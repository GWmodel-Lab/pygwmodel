[build-system]
requires = ["scikit-build-core", "nanobind >=2.0", "numpy", "geopandas"]
build-backend = "scikit_build_core.build"

[project]
name = "pygwmodel"
version = "0.0.1"
description = "A Python binding for GWmodel"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Yigong Hu", email = "yigong.hu@outlook.com" }
]
dependencies = [
    "numpy",
    "geopandas",
]

[project.urls]
Homepage = "https://github.com/GWmodel-Lab/pygwmodel"

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "0.4"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"

[tool.cibuildwheel]
build-verbosity = 1
build = "cp312-*"
skip = "pp* *-musllinux* *-manylinux_i686* *-win32 *-macosx_x86_64"
test-command = "pytest {project}/test -v"
test-requires = "pytest"

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.14"
