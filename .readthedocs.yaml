version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      - git submodule update --init --recursive

sphinx:
  configuration: doc/conf.py

python:
  install:
    - requirements: doc/requirements.txt
